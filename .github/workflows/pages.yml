name: Publicar blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar e verificar conteúdo público
        run: node --test tests/site.test.mjs
      - name: Gerar site
        run: node scripts/build-site.mjs
      - name: Conferir conteúdo gerado
        run: node --input-type=module -e "import { assertPublicSite } from './scripts/site-content-guard.mjs'; await assertPublicSite('site');"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
